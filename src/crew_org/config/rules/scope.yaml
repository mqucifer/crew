form.AlreadyDelivered.by_or_seen_at:
  description: Refused unless it names the story that delivered it, or where the code at main already
    does it.
  messages:
    default: name the story that delivered it in `by`, or, when no story did, where the code at main already
      does it in `seen_at`
  origin:
  - crew#807
  owner: Business Analyst
  told_in: AlreadyDelivered
form.Change.work_is_said:
  description: Refused if empty when `needs_work` is true.
  messages:
    default: '''{what}'' needs work on the project: say what that work is in `work`, as distinct from
      the edit to the design record'
  owner: Architect
  told_in: Change.work
form.Epic.is_an_argument:
  description: Refused if too short to say what a user could do with this epic alone.
  messages:
    default: state specifically what a user could do with this epic alone. If nothing, it is not a separate
      epic — fold it into another.
  owner: Product Owner
  told_in: Epic.separately_deliverable
form.Epic.not_a_restatement:
  description: Refused if it repeats the outcome.
  messages:
    default: separately_deliverable repeats the outcome. It must argue why this slice stands alone, which
      is a different question.
  owner: Product Owner
  told_in: Epic.separately_deliverable
form.EpicProposal.at_the_level_of_intent:
  description: Refused if an epic names a field, format, endpoint or file. An epic says which reader it
    serves and what they can now see, decide or do; the specifics are its stories' and design's.
  messages:
    default: '{epics}. An epic stays at the level of intent: say which reader it serves and what they
      can now see, decide or do, in plain words. Fields, formats, endpoints and files belong to its stories
      and design.'
  origin:
  - crew#815
  - crew#846
  owner: Product Owner
  told_in: EpicProposal.epics
form.EpicProposal.decomposed:
  description: Refused with fewer or more epics than its limits, or two with one title.
  messages:
    same_title: two epics share a title; each must be a distinct slice
    too_few: 'a goal must decompose into at least {least} epics, got {got}. One epic is not a decomposition:
      there is nothing to sequence and nothing deliverable early. Split by workflow step, by business
      rule, or by happy-path-then-edge-cases — never by architectural layer.'
    too_many: '{got} epics is too many for one goal (limit {limit}). Group the smaller slices into coherent
      outcomes.'
  owner: Product Owner
  told_in: EpicProposal.epics
form.MissingEpics.decomposed:
  description: Refused if empty, over its limit, or if two share a title.
  messages:
    none: 'name the epic the goal still lacks: at least one'
    same_title: two epics share a title; each must be a distinct slice
    too_many: '{got} epics is more than a goal lacks (limit {limit})'
  owner: Product Owner
  told_in: MissingEpics.epics
form.Placement.epic_is_named:
  description: Refused if empty for a change that belongs to an epic.
  messages:
    default: 'change {change} belongs to an epic: name it in `epic`'
  owner: Architect
  told_in: Placement.epic
form.Row.a_call_stays_within_the_goal:
  description: Refused if empty for your own call.
  messages:
    default: your own call quotes the Goal's wording that it stays within
  owner: Product Owner
  told_in: Row.goal_wording
form.SkeletonEpic.decomposed:
  description: Refused unless it's exactly one.
  messages:
    default: 'a walking skeleton is one epic, got {got}. Its pages, features and behaviour belong to the
      project''s own Goals: leave them out.'
  owner: Product Owner
  told_in: SkeletonEpic.epics
form.Story.on_the_scale:
  cases:
  - §5.5
  description: Refused if it isn't on the scale.
  messages:
    default: '{points} is not on the estimation scale {scale}. Anything larger than {most} must be split,
      not admitted.'
  owner: Business Analyst
  told_in: Story.points
form.StoryProposal.not_empty:
  description: Refused with no stories, unless everything is already delivered.
  messages:
    default: an epic must decompose into at least one story
  owner: Business Analyst
  told_in: StoryProposal
