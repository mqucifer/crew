# The work stays in the story. Declared once each (crew#756, ADR 0031): change a rule here.
check.backlog_order.check:
  cases:
  - told.form.BacklogOrder.holds
  - told.form.BacklogOrder.order
  - told.form.Hold.builds_on
  - told.form.Hold.story
  - told.refinement_crew.then_only_where_the_new_work
  description: Refused unless every open epic is ranked once and only those, and each hold is on an unstarted
    story listed, waiting for open work listed.
  messages:
    not_held: '#{n} isn''t an unstarted story, so it can''t be held'
    not_listed: '#{story} can''t wait for #{n}: it isn''t open work listed'
    not_open: '#{n} isn''t one of the open epics'
    twice: '#{n} is ranked twice'
    unranked: '#{n} isn''t ranked'
  told_in: BacklogOrder
check.conclusion.feedback:
  exempt: writes check.conclusion.problems' findings, which are told in StoryProposal; refuses nothing
    of its own
  messages:
    default: '## Your split doesn''t fit the epic''s conclusion


      {found}


      The conclusion''s rows are settled: a story follows them, never contradicts them.'
  owner: Business Analyst
check.conclusion.problems:
  description: Sent back unless every row of the conclusion is followed by a story or listed in `not_for_stories`,
    stories follow only rows, and each merged test the record changes is carried by a story or dropped
    with why.
  messages:
    silent: No story changes {tests}, which the record says this epic changes. Name each in the Existing
      tests line of the story that changes it, or list it in `tests_dropped` with why.
    unknown: Story '{title}' follows {rows}, not rows of the epic.
    unknown_left: not_for_stories names {rows}, not rows of the epic.
    unused: No story follows {rows}. Name the story that does in its `follows`, or list the row in `not_for_stories`
      with why it is not for stories.
  origin:
  - crew#248
  - crew#583
  owner: Business Analyst
  told_in: StoryProposal
check.refinement_crew.check:
  description: Refused if `already_delivered` or a story's `builds_on` names a story neither delivered
    nor planned, if a story it replaces isn't accounted for, or if a story names a package field the pinned
    package doesn't define.
  messages:
    not_a_story: '`builds_on` names {stories}, which aren''t stories this project has delivered or other
      epics plan. The order of `stories` is their delivery order, so a story needs no `builds_on` for
      one of this split''s: `builds_on` is for other epics'' stories, by their issue number.'
    not_delivered: already_delivered names {stories}, which the project has neither delivered nor planned.
      Name a delivered or planned story, or write the story.
    not_in_package: 'these aren''t fields of the package this project pins: {fields}. Name the field each
      value comes from as the package''s contract lists it. A value the package doesn''t carry goes in
      `not_in_package`, for the Sponsor, and no story shows it.'
    unaccounted: 'the split doesn''t say what became of {stories}. Account for each: rewritten here, already
      delivered, or dropped and why.'
  origin:
  - crew#807
  owner: Business Analyst
  told_in: StoryProposal
check.settle_crew.check_grounded:
  description: Refused if the wording isn't in the Goal.
  messages:
    default: '{rows}: your own call quotes wording that isn''t in the Goal. Quote the Goal''s own words
      exactly, or if the Goal doesn''t say which way it points, ask the Sponsor one question instead.'
  owner: Product Owner
  told_in: Row.goal_wording
check.settle_crew.check_product_calls:
  description: Refused if your own call settles a note a member marked for the Architect.
  messages:
    default: '{rows} are your own call on a note a member marked for the Architect. That is a design question:
      list it as an open question for the design note, or give a source that settles it. Your own calls
      are for what the product does.'
  origin:
  - ADR 0018
  owner: Product Owner
  told_in: Row.own_call
