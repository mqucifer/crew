hold.waits_for_earlier_work:
  cases:
  - hold.sibling
  - hold.builds_on
  - decision.sprint.waits_on_work_outside
  description: 'A story waits for the work it builds on: an earlier sibling in its epic, or work it names,
    outside or inside the sprint. A role''s Task under an epic, its CI and release, waits for every story
    of the epic.'
hold.wip:
