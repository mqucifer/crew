decision.acceptance.ci_only:
decision.acceptance.close_finished_parents:
  origin:
  - crew#174
  - crew#185
  - crew#187
  - sprint-metrics#184
decision.alerts.alert_tasks:
  description: Each of the crew's alerts firing in Grafana (labelled audience crew, read with a read-only
    token) opens one DevOps Task in infra, keyed by its fingerprint and when it began firing, in Ready.
    The Sponsor's alerts open none. A firing whose Task was closed while it still fires opens no other.
  origin:
  - crew#893
decision.alerts.fired:
  description: An alert that fires again while its Task is open is said on that Task once, not opened
    as a second Task.
  origin:
  - crew#893
decision.alerts.resolved:
  description: An open alert Task whose alert no longer fires is told so once per firing; it stays open
    until DevOps's review is done. Nothing is marked resolved in a pass that couldn't read Grafana.
  origin:
  - crew#893
decision.alerts.unread:
  description: Grafana's alerts that can't be read (no token, unreachable, refused or unreadable) are a
    held line each pass, and the tick goes on. Unread for 24 hours straight, they become one DevOps
    finding in infra, keyed by the day it began; reading them again clears the count.
  origin:
  - crew#893
decision.announcements.announced_tasks:
  description: A producer's announced new major, read from its `announced.json` beside the contract
    files a project's record names, opens the Architect's Task in Needs Refinement in each project that
    pins a release at the major it replaces, once per project, producer and version, never again once
    closed. Nothing is filed in the producer's own repository.
  origin:
  - crew#960
decision.announcements.none_published:
  description: A producer a project uses that publishes no `announced.json` files nothing, and each pass
    notes it.
  origin:
  - crew#960
decision.unreleased.unreleased_releases:
  description: Entries under a project's `[Unreleased]` that no epic in flight will release open
    DevOps's release Task, once per version they follow, a PATCH when they're only fixes. An open
    release Task, or an open epic with stories and no release Task yet, carries them instead; a
    project never released waits for its first epic's.
  origin:
  - crew#961
decision.backlog_order.what_is_ordered:
  description: The Product Owner ranks the open epics with no Rank. One it can't place yet is held for
    the work it builds on, and an order it can't give is recorded as failed.
decision.board_flow.already_delivered:
  description: An epic whose stories would only repeat delivered work is closed as already delivered,
    naming the stories that delivered it.
  origin:
  - crew#192
  - crew#440
decision.board_flow.epics_to_split:
decision.board_flow.goal_cards:
decision.board_flow.lacking_goals:
decision.board_flow.parked:
  origin:
  - crew#192
  - crew#440
decision.board_flow.parked_goals_released:
  description: A Goal the Sponsor parked, filed without the `goal` label and with no Work Type, is released
    by adding the label. The tick moves it to Inbox (Goals) from wherever it waits, clears its `needs:human`,
    and types it, so it's decomposed that pass.
  origin:
  - crew#829
  - mqucifer/sprint-metrics#659
decision.board_flow.points_elsewhere:
  origin:
  - crew#846
decision.board_flow.product_step:
  origin:
  - crew#189
decision.board_flow.skeleton_only:
  origin:
  - ADR 0030
  - crew#690
decision.board_flow.sponsor_words:
  origin:
  - ADR 0023
decision.board_flow.started:
  origin:
  - crew#189
  - sprint-metrics#97
decision.board_flow.technical_work_first:
  origin:
  - crew#192
  - crew#440
decision.bugs.carry_out:
decision.bugs.collaborators_only:
decision.ci.same_failure_stop:
  description: A card CI returns delivery.ci_same_failure_stop times running with the same failing
    tests is blocked for a person, with the log, instead of another session that would be shown the
    failure it has already answered.
  origin:
  - crew#944
decision.close.carry_over:
  origin:
  - crew#389
decision.delivery.interrupted:
  description: A delivery a service interrupted, not the story, is tried again next pass; three in a row
    block it for a person.
decision.delivery.limit:
decision.delivery.outcome:
decision.delivery.reconcile_orphans:
decision.delivery.rework:
  description: A story whose pull request was refused at its head goes back to In Progress for re-work,
    when the column has room.
  origin:
  - sprint-metrics#31
decision.delivery.waits_on_files:
  description: A story's rebuild waits while another open pull request changes the same files.
  origin:
  - crew#436
  - sprint-metrics#384
decision.deploy.failed:
  description: A deploy that fails at its pull, its start or its health check rolls back to the release
    that was running, read from the container, and files DevOps's finding with the deploy's log, every
    settings value taken out first. Its Task ends in Done once the old release is healthy again; if the
    rollback fails too, it goes to Blocked with needs:human and a standup line for the Sponsor.
  origin:
  - crew#829
decision.deploy.healthy:
  description: A deploy whose health check passes, as infra's inventory declares it, ends its Task in Done
    and opens an infra pull request with only the new tag.
  origin:
  - crew#829
decision.deploy.held:
  description: A verified release isn't deployed while a reader infra declares pins another MAJOR, or while
    its settings file isn't on the Mac. Recorded each pass and said on the standup, naming who moves first.
  origin:
  - crew#829
decision.deploy.opened:
  description: A release the release check verified, newer than infra's pinned tag for a service that
    declares its repository, opens DevOps's deploy Task once per repository and version, and the tick runs
    it with no model. A Task with an outcome, or closed, is never run again.
  origin:
  - crew#829
  - crew#839
decision.deploy.record:
  description: The crew merges its own infra pull request recording a healthy deploy's tag once infra's
    guard checks pass; the release's merge was the Sponsor's approval.
  origin:
  - crew#829
decision.diagnose.diagnose_blocked:
  origin:
  - sprint-metrics#200
decision.github_issues.trust:
  description: A comment from an account outside org.yaml's trust list isn't read (crew#399).
decision.goal_look.look_step:
  description: An epic under a Goal is split once the Goal's record covers it, written from one look across
    the Goal's approved epics and its settle.
  origin:
  - crew#858
decision.land:
  cases:
  - decision.merge.land
  - decision.merge.merge_approved
  - decision.close.close_sprint
  - decision.revert.land
  description: An approved pull request lands through one path, and each way landing ends is handled by
    the phase that asked.
  origin:
  - crew#116
  - crew#302
  - crew#314
  - crew#389
  - crew#436
decision.main_watch.red_main:
decision.merge.conflict:
  description: An approved pull request that conflicts with main keeps both sides where both only add;
    otherwise the crew rebuilds it, up to its limit, then it's blocked for a person.
  origin:
  - crew#100
  - crew#158
  - crew#95
decision.phase_cards:
  cases:
  - decision.delivery.sprint_stories
  - decision.merge.merged_elsewhere
  - decision.review.what_is_reviewed
  - decision.sprint.left_over
  - decision.sprint.parked
  - decision.bugs.bugs_to_triage
  - decision.board_flow.goals_missing_work_type
  description: A phase takes the open cards in its column, of the types it works, in the repositories
    the crew works, and QA's Tasks in qa-suite for those projects, by their project label.
  origin:
  - crew#353
  - crew#945
  - sprint-metrics#284
decision.release_check.check_releases:
  description: 'Each project''s current release is checked once its release run for the head has finished:
    verified, waiting on the Sponsor, or a technical epic for what it''s missing.'
decision.resplit.affected:
  description: An epic sent back is split again only where the problem reaches. The stories it names and
    every later story of the epic are replaced, once their replacements exist, and the rest stay; a problem
    that names none replaces every unstarted story.
  origin:
  - crew#859
decision.resplit.stop:
  description: An epic re-split after story problems as many times as refinement.resplit_stop allows (3
    to start) sends its next problem to the Sponsor as one question, with every round so far, not to the
    Product Owner. Every round and every stop is an event, so the stop is lowered from evidence.
  origin:
  - crew#859
decision.revert.refused:
decision.revert.return_card:
decision.review.against_the_story:
  description: QA's Task refused against the story it quotes, not its own criteria, goes back to review
    wherever the refusal left it.
  origin:
  - crew#971
decision.review.deploy_review:
  origin:
  - crew#215
  - crew#252
decision.review.verdict:
  origin:
  - crew#215
  - crew#252
decision.revisit.back_to_work:
  origin:
  - crew#690
decision.revisit.design_faults:
decision.revisit.file_work:
  description: 'A design revisit ends in a record of what it found: refused, no change, its work filed,
    or a revision pull request the crew merges.'
decision.rework_gate:
  cases:
  - decision.board_flow.rework_gate
  - skip.board_flow.rework_refused
  - skip.board_flow.already_answered
  description: A Goal the Sponsor sent back is decomposed again only on their word, and once, its unstarted
    epics superseded. An epic sent back goes through decision.resplit.affected (crew#859).
  origin:
  - crew#192
  - crew#440
decision.qa_tasks.already_justified:
  description: A Developer disputing a QA test QA already justified, its file unchanged, opens no new
    Task; its session is told the test stands, with QA's why and the Task's link, and changes the code.
  messages:
    default: 'You disputed `{test}`. QA already justified it, and it hasn''t changed since ({task}):


      {why}


      The test stands. Change the code so it passes, then call `done`.'
  origin:
  - crew#896
decision.qa_tasks.dispute_settled:
  description: A story waiting on QA's dispute Task goes on once QA has answered. Justified, the Task
    closed, it goes back to the Developer with the test unchanged and QA's why as CI's verdict on its
    head; fixed, QA's pull request approved, an empty commit runs its checks again with QA's tests and
    it goes to review, labelled lands-with:qa.
  origin:
  - crew#896
  - crew#945
decision.qa_tasks.disputed:
  description: A Developer whose pull request fails QA's check, and who thinks the test is wrong, disputes
    it; QA's Task opens in qa-suite to fix or justify it, and the story waits on it, blocked and labelled
    waits:qa, not sent back (ADR 0006 in mqucifer/project-print).
  origin:
  - crew#896
decision.qa_tasks.justified:
  description: QA's dispute Task closes with no change when the test is right, saying why on the Task.
  origin:
  - crew#896
decision.qa_tasks.lands_with_story:
  description: A disputed story and QA's changed test land back to back, the story first. The story
    waits until QA's pull request is approved and its checks, run against the story's head, passed;
    QA's waits until the story's has landed. Before it, QA's test would fail the project's main.
  origin:
  - crew#945
decision.qa_tasks.no_test:
  description: QA's test Task closes with no change when nothing it asks can be reached through the
    surface its project's folder names, saying why; recorded, so the retro sees where the surface falls
    short.
  origin:
  - crew#896
decision.qa_tasks.test_task:
  description: A story or a bug's fix merged in a project with a folder in qa-suite opens QA's Task for
    its test, once. After the merge, not at the split, since qa-suite's main runs against every pull
    request and a test of unmerged work would fail them all. Only work merged on or after
    delivery.qa_tests_from, with no backfill, and none while it's unset.
  origin:
  - crew#896
  - crew#945
decision.role_tasks.carry_out:
  description: A role's Task filed from a finding is triaged as a bug is, by the Business Analyst (ADR
    0027), into Ready with what done means and a size, or closed with why.
  origin:
  - crew#839
decision.role_tasks.ci_services:
  description: Once the first workspace Task is closed, and a story's whole checks pass with the default
    branch's services up or main's own do in a container with them, DevOps gets its Task to make CI's
    test job run the same services, once. Main's are run at most once per head commit, and only while
    the Task isn't opened.
  origin:
  - crew#839
decision.role_tasks.epic_split:
  description: An epic's split opens DevOps's Task for the epic's CI and release, one per epic, in place
    of a release story (ADR 0019). One the split couldn't open is opened by the next pass, from the board
    alone.
  origin:
  - crew#839
  - crew#816
decision.role_tasks.first_diagram:
  description: A worked repository with no diagram of its system gets the Architect's Task to draw one,
    once; not one waiting for its walking skeleton.
  origin:
  - crew#839
decision.role_tasks.first_workspace:
  description: A worked repository with no workspace file (devcontainer.json) gets DevOps's Task to write
    it and the services its tests need, once; not one waiting for its walking skeleton. CI comes in a
    later Task (decision.role_tasks.ci_services).
  origin:
  - crew#860
  - crew#839
decision.role_tasks.goal_epics_done:
  description: A Goal whose epics are all done opens the Architect's Task to make its target diagram the
    repository's, corrected to what was built, and closes once that Task is done too.
  origin:
  - crew#839
  - crew#858
decision.role_tasks.no_qa:
  description: A role's Task skips QA's proof, which has no story criteria to prove; its role's checks
    ran at done and the Code Reviewer judged it. QA's own Task is its test, which qa-suite's CI runs.
  origin:
  - crew#839
decision.role_tasks.not_opened:
  description: A role's Task an event should open and GitHub refused is recorded, and the next pass tries
    again; nothing marks it opened until it is.
  origin:
  - crew#839
decision.role_tasks.seen_again:
  description: DevOps's workspace finding met again on a story tells its Task once per story. A closed
    one is reopened, its card back where a Task waits for its work, since the gate otherwise filed into
    it with nothing said.
  origin:
  - crew#917
  - mqucifer/sprint-metrics#743
decision.role_tasks.sponsor_approves:
  description: A role's Task whose work is the repository's diagram or a release merges only once the
    Sponsor approves it; a Task from a finding merges after the Code Reviewer, as a bug does.
  origin:
  - crew#839
decision.role_tasks.turned_on:
  description: The Developer's bug for the merged tests a workspace Task turned on is filed when it merges,
    only for DevOps's Task whose pull request changed the workspace, and only from the crew's record for
    the head that merged. Filed however the card reached Done, the board's workflow included, while it
    closed within the last 14 days, and once, by its tests, a closed bug counting as filed.
  origin:
  - crew#839
decision.ux_review.blocked:
  description: A UX Designer's review that couldn't be worked (no live release, a published site `look`
    can't fetch, its session stopped, or GitHub refused) is blocked for a person with why, as a Task is;
    it isn't split. A site that can't be fetched is found before the session, so no model call is spent.
  origin:
  - crew#830
decision.ux_review.release_review_tasks:
  description: A release whose site is live (a Pages deployment succeeded after its GitHub Release) opens
    the UX Designer's review Task, once per repository and version; only for a project GitHub has a Pages
    site for and whose record names a reader.
  origin:
  - crew#830
decision.ux_review.reviewed:
  description: A UX Designer's Task is worked by its review session, not the Developer's path. Its
    corrections are filed as bugs or Tasks, up to ten per owner, each with its page, width, standard and
    screenshot; then it's closed and Done, with no pull request. It never blocks a merge.
  origin:
  - crew#830
