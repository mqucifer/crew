form.Conclusion.says_something:
  description: Refused if it has no rows, open questions, items for infra or dismissals.
  messages:
    default: 'a conclusion answers the notes: give rows, questions or dismissals'
  owner: Product Owner
  told_in: Conclusion
form.DesignAnswer.an_id:
  description: Refused if it isn't a question's ID, like Q1.
  messages:
    default: name the question by its ID, like Q1
  owner: Architect
  told_in: DesignAnswer.question
form.DesignNote.covers_the_stories:
  description: Refused if empty.
  messages:
    default: a design note gives each story its direction
  owner: Architect
  told_in: DesignNote.stories
form.DesignProposal.enforces_something:
  description: 'Refused if empty: at least one check enforces the definition of done.'
  messages:
    default: 'a design names at least one check: without one, nothing enforces the definition of done'
  owner: Architect
  told_in: DesignProposal.checks
form.FileAsk.a_bare_path:
form.Finding.is_actionable:
  description: Refused if it doesn't say specifically what to change.
  messages:
    default: say specifically what to change. A finding an author cannot act on is not a finding.
  told_in: Finding.action
form.PanelAnswer.one_or_the_other:
  description: Refused unless it gives notes or says nothing to add, not both.
  messages:
    no_notes: 'no notes: give at least one, or say nothing to add'
    with_notes: 'nothing_to_add with notes: give notes, or nothing to add'
  told_in: PanelAnswer
form.PlannedFile.says_what:
  description: Refused if it doesn't say what changes.
  messages:
    default: say what changes in this file
  owner: Developer
  told_in: PlannedFile.intent
form.PresentationNote.has_a_sample:
  description: Refused if empty.
  messages:
    default: the note carries a sample of the finished output
  owner: UX Designer
  told_in: PresentationNote.sample
form.ProcessDefect.is_a_change:
  cases:
  - told.retro_crew.a_larger_escalation_budget_is_never
  - told.scrum_master.never_propose_a_larger_escalation_budget
  description: Refused if it asks for a larger escalation budget.
  messages:
    default: a larger escalation budget is not a process improvement. Escalation rate is a symptom of
      task design; name the design change instead.
  owner: Scrum Master
  told_in: ProcessDefect.change
form.ProcessDefect.short:
  description: Refused if it runs over its length limit.
  messages:
    default: a title is a short statement of the problem, under {limit} characters; this one is {length}
  owner: Scrum Master
  told_in: ProcessDefect.title
form.ProductAnswer.one_or_the_other:
  description: Refused unless it gives an answer or one question, not both; an answer names what it follows,
    as rows.
  messages:
    based_on: 'an answer names what it follows: the Goal, the record, or a story'
    not_both: give an answer grounded in the project, or one question; not both
    rows: 'an answer is written as rows of the epic''s record: give at least one'
  owner: Product Owner
  told_in: ProductAnswer
form.Retro.few:
  description: Refused if it has more bullets than its limit.
  messages:
    default: 'at most {limit} bullets: the notable events, not a replay'
  owner: Scrum Master
  told_in: Retro.went
form.ReviewVerdict.a_rejection_must_say_why:
  cases:
  - told.form.Finding.blocking
  description: Refused if it requests changes with no blocking finding, or approves with one.
  messages:
    approved_blocking: 'an approval can''t carry a finding that blocks. Request changes, or mark it `blocking:
      false` if it''s a note that doesn''t hold the merge up.'
    no_blocking: requesting changes with no finding that blocks is not a review. Name what must change
      and what to do, or approve.
  origin:
  - crew#139
  - crew#214
  told_in: ReviewVerdict
form.RowNotForStories.row_id:
  description: Refused if it isn't a row's ID, like R3.
  messages:
    default: name the row by its ID, like R3
  owner: Business Analyst
  told_in: RowNotForStories.row
form.Settlement.one_or_the_other:
  description: Refused unless it gives a conclusion or one question for the Sponsor, not both.
  messages:
    default: give a conclusion, or one question for the Sponsor; not both
  owner: Product Owner
  told_in: Settlement
form.Settlement.stripped:
  owner: Product Owner
form.Story.row_ids:
  description: Refused unless each is a row's ID, like R1.
  messages:
    default: '{ids}: name rows of the conclusion by ID, like R1'
  owner: Business Analyst
  told_in: Story.follows
form.row.an_id:
  cases:
  - form.AnswerRow.an_id
  - form.SponsorRow.an_id
  description: When set, refused unless it's an ID, like R3 or Q1.
  messages:
    default: name a row or question of the epic's record by its ID, like R3 or Q1
  owner: Product Owner
  told_in: AnswerRow.replaces, SponsorRow.replaces
session.arguments:
  description: A tool call names a tool there is, with an object of the arguments it takes and each one
    it needs.
  messages:
    missing: '`{tool}` needs {missing}. It takes: {takes}. Nothing was done.'
    no_tool: 'There''s no tool `{tool}`: use one of {tools}.'
    not_an_object: '`{tool}`''s arguments aren''t a JSON object: call it again.'
    unknown: '`{tool}` doesn''t take {unknown}. It takes: {takes}. Nothing was done.'
  origin:
  - crew#778
  owner: Developer
session.search:
  description: '`search` is given a pattern, and a path there is.'
  messages:
    empty: Give the pattern to find.
    no_path: 'There''s no file or folder `{path}`: the map lists every file.'
  origin:
  - crew#778
  owner: Developer
session.view:
  description: '`view` shows a text file there is, or a definition it has.'
  messages:
    no_definition: '`{path}` defines no `{name}`.{names}'
    no_file: There's no file `{path}`. The map lists every file; `search` finds text.
    not_text: '`{path}` isn''t text.'
  origin:
  - crew#778
  owner: Developer
