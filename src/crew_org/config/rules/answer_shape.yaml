# The answer parses and is complete. Declared once each (crew#756, ADR 0031): change a rule here.
call.check_not_cut_at_a_quote:
  messages:
    default: 'These fields stop mid-sentence: {fields}. A double quote inside a value ends the field and
      the rest is lost. Write values in single quotes (''sponsor''), never double quotes, and finish each
      field.'
  origin:
  - crew#618
  - sprint-metrics#555
call.join_blocks:
  messages:
    not_a_name: '`{key}` holds {value}, which isn''t a block''s name: blocks are named b1, b2 and so on,
      and the blocks written are {written}. Put the name of the block holding its code in `{key}`'
    unwritten: '`{key}` names block {name}, which isn''t written after the JSON: write it between @@@
      {bare} @@@ and @@@ end @@@'
  origin:
  - ADR 0024
  - ADR 0025
  - ADR 0026
  - crew#583
  - crew#734
  - sprint-metrics#529
call.schema:
  cases:
  - §5.2
  origin:
  - ADR 0025
call.split_blocks:
  messages:
    outside: 'text after the JSON outside any block: {line}. Write each block between its @@@ name @@@
      line and @@@ end @@@'
    twice: 'block {name} is written twice: write each block once'
    unclosed: 'block {name} has no @@@ end @@@ line: close every block'
  origin:
  - ADR 0024
  - ADR 0025
  - ADR 0026
  - crew#583
  - sprint-metrics#529
call.the_answer_ran_on_as:
  messages:
    default: 'the answer ran on as whitespace after this, so a string closed early or a list or object
      was left open: ...{tail}


      Check that each string ends exactly where you mean it to, with every double quote inside it escaped,
      and close each list and object you open'
call.the_answer_was_empty_you:
  messages:
    default: 'the answer was empty: you stopped before writing it. Think less and write the whole answer'
call.the_json_before_the_blocks:
  messages:
    default: 'the JSON before the blocks isn''t valid JSON: {error}'
check.settle_crew.check_covers:
  description: Refused unless every note, N1 to the last, is answered, and nothing answers a note that
    isn't there.
  messages:
    count: There are {count} notes, N1 to N{count}.
    missing: 'No row, question or dismissal for {notes}. '
    unknown: '{notes} are not notes. '
  owner: Product Owner
  told_in: Settlement
check.settle_crew.check_design_covers:
  description: Refused unless it answers each question left for you once, by its ID, and only those.
  messages:
    asked: 'The questions are {questions}: answer each once, by its ID.'
    missing: 'You didn''t settle {questions}. '
    twice: '{questions} answered more than once. '
    unknown: '{questions} aren''t questions left for you. '
  owner: Architect
  told_in: DesignSettlement
check.settle_crew.cut:
  description: 'Refused if a cell reaches its length limit: one at the limit was cut off.'
  messages:
    default: 'These cells reached their length limit and were cut off: {cells}. Say each in fewer words,
      well under the limit, and finish the thought.'
  told_in: Settlement, DesignSettlement
check.settle_crew.not_cut_at_a_quote:
  description: Refused if a cell stops where a double-quoted value would begin.
  messages:
    default: 'These fields stop mid-sentence: {fields}. A double quote inside a value ends the field and
      the rest is lost. Write values in single quotes (''sponsor''), never double quotes, and finish each
      field.'
  origin:
  - crew#618
  told_in: Settlement
