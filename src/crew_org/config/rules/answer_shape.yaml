# The answer parses and is complete. Declared once each (crew#756, ADR 0031): change a rule here.
call.check_not_cut_at_a_quote:
  messages:
    default: 'These fields stop mid-sentence: {fields}. A double quote inside a value ends the field and
      the rest is lost. Write values in single quotes (''sponsor''), never double quotes, and finish each
      field.'
  origin:
  - crew#618
  - sprint-metrics#555
call.schema:
  cases:
  - §5.2
  origin:
  - ADR 0025
call.the_answer_ran_on_as:
  messages:
    default: 'the answer ran on as whitespace after this, so a string closed early or a list or object
      was left open: ...{tail}


      Check that each string ends exactly where you mean it to, with every double quote inside it escaped,
      and close each list and object you open'
call.the_answer_was_empty_you:
  messages:
    default: 'the answer was empty: you stopped before writing it. Think less and write the whole answer'
check.goal_look_crew.check_epics:
  description: Refused if it names an epic that isn't the Goal's, or, for the reader, leaves out an epic
    it read.
  messages:
    missing: say what the reader meets in {epics} too
    unknown: '{epics} aren''t epics of this Goal: name its epics as owner/repo#number, or `all`'
  origin:
  - crew#858
  told_in: SystemLook, ReaderLook
check.settle_crew.asks_beyond_the_goal:
  description: Refused if it settles a call beyond the Goal before the Sponsor has answered it.
  messages:
    default: '{items} reach beyond the Goal: ask the Sponsor, as one question with no conclusion'
  origin:
  - crew#858
  owner: Product Owner
  told_in: GoalSettlement
check.settle_crew.check_covers:
  description: Refused unless every note, N1 to the last, is answered, and nothing answers a note that
    isn't there.
  messages:
    count: There are {count} notes, N1 to N{count}.
    missing: 'No row, question or dismissal for {notes}. '
    unknown: '{notes} are not notes. '
  owner: Product Owner
  told_in: Settlement
check.settle_crew.check_goal_epics:
  description: Refused if a row or question names an epic the look didn't read.
  messages:
    default: '{epics} aren''t epics the look read: name them as owner/repo#number, or `all`'
  origin:
  - crew#858
  owner: Product Owner
  told_in: GoalSettlement
check.settle_crew.cut:
  description: 'Refused if a cell reaches its length limit: one at the limit was cut off.'
  messages:
    default: 'These cells reached their length limit and were cut off: {cells}. Say each in fewer words,
      well under the limit, and finish the thought.'
  told_in: Settlement, DesignSettlement
check.settle_crew.not_cut_at_a_quote:
  description: Refused if a cell stops where a double-quoted value would begin.
  messages:
    default: 'These fields stop mid-sentence: {fields}. A double quote inside a value ends the field and
      the rest is lost. Write values in single quotes (''sponsor''), never double quotes, and finish each
      field.'
  origin:
  - crew#618
  told_in: Settlement
