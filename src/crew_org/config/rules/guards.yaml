guard.bounds.out_of_bounds:
  messages:
    default: 'This change goes outside what the project allows:


      {reasons}{not_applied}'
    protected: '`{path}` is protected by the project''s record (`{protected_by}`{why} in {record}). Leave
      it unchanged.'
    weakened: 'CI would no longer enforce `{check}`, a check the project''s design requires ({record}).
      Workflows may change, but every design check must still run there and still be able to fail: no
      `|| true`, no `continue-on-error`.'
  owner: Developer
guard.role_tasks.out_of_scope:
  description: A role's Task changes only its role's area (crew#839); what else it needs is its own finding,
    a bug or another Task.
  messages:
    default: 'This is the {role}''s Task, which may change only {scope}. It changes {paths}: undo those,
      and say in `done`''s summary what they were for.'
  owner: Developer
session.git:
  description: The git tool runs one git command line with no shell, and only the commands that read and
    `restore`; never an option that writes, reads outside the repository or runs a program.
  messages:
    empty: Give a git command line, such as `git diff base`. It runs {allowed}.
    global_option: '`{option}` comes before the command, and git''s own options are the crew''s to set.
      It runs {allowed}. Nothing was run.'
    not_allowed: '`git {command}` isn''t run here: the session''s git reads and restores, and the crew
      commits. It runs {allowed}.'
    option: '`{option}` isn''t taken: it {why}. Nothing was run.'
    read_only: '`git {command}` isn''t run here: this step reads, and changes nothing. It runs {allowed}.'
    shell: 'There''s no shell: {operators} would be a shell''s. Run one git command; its whole output
      comes back.'
    unparsed: 'The command line can''t be split into words: {error}.'
  origin:
  - crew#778
  owner: Developer
session.path:
  description: A tool reads and writes only the worktree, never the crew's own folders or what tools make,
    and never through a symbolic link that leads out of it.
  messages:
    link: '`{path}` is a symbolic link: edit the file it leads to instead.'
    outside: '`{path}` isn''t a path in the repository: give it relative to its root.'
    skipped: '`{path}` is in a folder the session doesn''t {verb}.'
  origin:
  - crew#778
  owner: Developer
