# Safety guards. Declared once each (crew#756, ADR 0031): change a rule here.
check.delivery.workflows_not_permitted:
  description: 'A `.github/workflows` change is blocked while the GitHub App lacks `workflows: write`.'
  messages:
    default: 'this change edits {files}, and the crew''s GitHub App has no `workflows: write` permission,
      so GitHub would refuse the push. The Sponsor grants it on the app and accepts it on the installation
      (crew#279)'
  origin:
  - crew#279
  owner: Developer
  told_in: FirstAttempt, FirstOrDone, Implementation, Rework
check.design.image_problems:
  description: Refused unless it's pinned by a digest its registry has.
  messages:
    missing: 'the sandbox image `{image}` doesn''t exist: no such digest in {host}'
    unpinned: the sandbox image `{image}` isn't pinned by digest (name@sha256:...)
    unverified: 'the sandbox image `{image}` can''t be verified: {why}'
  origin:
  - crew#403
  owner: Architect
  told_in: DesignProposal.sandbox_image
check.design.needs_an_image:
  description: Refused if empty when a check or a part needs more than Python and uv.
  messages:
    check: the check `{check}`
    default: '{needs} needs more than the crew''s default sandbox, which has only Python and uv. Name
      the image they run in, with every tool the checks need, in `sandbox_image` (registry/name:tag),
      and its install command in `setup`.'
    part: the {language} part `{path}`
  origin:
  - crew#516
  owner: Architect
  told_in: DesignProposal.sandbox_image
check.design.shelled:
  description: Refused if a setup, check or autofix command needs a shell.
  messages:
    default: '`{command}` uses {operators}, but the crew runs each command without a shell. Name one command;
      where it needs several steps, a script in the repository that the skeleton''s first story writes'
  origin:
  - crew#690
  owner: Architect
  told_in: DesignProposal
check.design.undeclared:
  description: Refused if a check CI doesn't run today, or a new CI proof, has no change that says so.
  messages:
    new_proof: '`{proof}` is a new CI proof, and no change says the work that makes CI prove it. List
      it in `changes` with `needs_work` and the work.'
    not_in_ci: '`{check}` isn''t a check CI runs today. If it should be, list it in `changes` (what, what
      the project does now, and why); if CI already runs it under another command, name that command instead.'
  origin:
  - crew#335
  owner: Architect
  told_in: DesignProposal.changes
check.design.unlocked:
  description: Refused unless it names a lockfile a package manager writes.
  messages:
    none: 'the design names no lockfile. Name the file the setup''s package manager writes, its path from
      the repository''s root: {known}'
    not_a_lockfile: '`{path}` isn''t a lockfile a package manager writes, so a story would have to write
      its pins and hashes by hand, and can''t resolve them. Name one the setup''s tool writes when it
      installs: {known}. For Python, `pyproject.toml` with `uv.lock`, setup running `uv sync`'
  origin:
  - crew#690
  owner: Architect
  told_in: DesignProposal.lockfile
check.role_tasks.diagram_renders:
  description: The Architect's Task leaves the repository's diagram as a C4 diagram in Mermaid that renders,
    checked as the Goal's target diagram is (crew#839).
  messages:
    default: 'The repository''s diagram won''t render: {problems}.'
  owner: Architect
check.role_tasks.setup_failed_at_start:
  description: A DevOps workspace Task whose own branch's setup fails at the session's start is told
    it, as a finding at `done` is, and works it; a story's stays a workspace that isn't ready (crew#839).
  messages:
    default: 'Your branch''s setup failed at the start, after a second try. The workspace is yours, so
      this is your Task''s work, not a reason to stop:


      {ran}


      This session''s container has no setup and no network: the dependencies aren''t installed, and
      a test that needs them fails here. You can read and edit, run `workspace_check`, and run what
      needs nothing installed. Your setup as the branch has it then runs again, with the network, at
      `done`, which says how it went. The `workspace` skill says how the crew runs setup.'
  owner: DevOps Engineer
check.role_tasks.workspace_checks:
  description: DevOps's workspace file and its compose file pass the gate's checks at `done`, run before
    it by `workspace_check`; starting the services stays the gate's (crew#839).
  messages:
    default: 'The workspace file or its compose file won''t pass:

      {problems}'
  owner: DevOps Engineer
