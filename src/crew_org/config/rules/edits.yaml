# A change applies cleanly. Declared once each (crew#756, ADR 0031): change a rule here.
config.const.regression.RESTORE_CHAR_CEILING:
config.const.workspace.DEFAULT_TIMEOUT:
config.const.workspace.HANG_AFTER:
  origin:
  - crew#839
config.const.workspace.MAX_FAILURE_REPORT_CHARS:
edit.ast_edit.apply_edit:
  description: Refused if the name is no definition in the file, if the file doesn't parse, or if the
    replacement is empty.
  messages:
    empty: 'replacing {target} with nothing: to remove it, use `replace_text` on its lines'
    no_definition: 'no definition named {target}. This file defines: {known}. A file''s imports and its
      `if __name__` block have no name: to change those, use `replace_text` (#204).'
    unparsed: 'the file does not parse: {error}'
  owner: Developer
repair.unsafe_fix.B905:
  origin:
  - crew#758
  - sprint-metrics#453
repair.unsafe_fix.SIM102:
  origin:
  - crew#758
  - sprint-metrics#563
repair.workspace.autofix:
  origin:
  - crew#758
session.parse_guard:
  description: 'An edit that would stop a Python file parsing isn''t applied: the reply shows the error,
    the lines as they would have been and as they are.'
  messages:
    default: 'Your changes have NOT been applied: `{path}` would stop parsing ({error}, line {line}).

      The lines as they would have been:

      {after}

      The lines as they are:

      {before}'
  origin:
  - crew#778
  - SWE-agent's edit guardrail
  owner: Developer
session.replace_definition:
  description: '`replace_definition` changes an existing Python file.'
  messages:
    not_python: '`{path}` isn''t an existing Python file: use `replace_text` or `write_file`.'
  origin:
  - crew#778
  owner: Developer
session.replace_text:
  description: '`replace_text` quotes whole lines of a file there is, once in it, and changes them.'
  messages:
    already: '`old` isn''t in `{path}`, and `new` already is: the change may be made.'
    closest: 'Those lines aren''t in `{path}`. The closest block starts at line {line}:

      {shown}'
    empty: Quote the lines to replace.
    no_file: 'There''s no file `{path}`: `write_file` makes a new one.'
    not_found: 'Those lines aren''t in `{path}`, and nothing close is: view the file first.'
    part_of_a_line: '`old` matches only part of a line, not whole lines: {where}. Quote whole lines.'
    same: '`old` and `new` are the same: nothing to change.'
    twice: 'Those lines occur {count} times in `{path}`, at lines {lines}: quote more lines around the
      one you mean.'
  origin:
  - crew#778
  owner: Developer
session.restore:
  description: '`git restore` takes `--source=<ref>` and files, and writes text files in the branch only.'
  messages:
    folder: '`{path}` is a folder, at `{ref}` or in your branch: name the files in it.'
    link: '`{path}` is a symbolic link or a submodule at `{ref}`: the session writes files only.'
    neither: '`{path}` is neither at `{ref}` nor in your branch.'
    no_paths: 'Name the files to restore: `git restore --source={ref} -- <paths>`.'
    no_ref: '`{ref}` isn''t a commit here: {said}'
    no_source: '`git restore` here takes `--source=<ref>`, such as `--source=base` or `--source=HEAD`,
      and the files: `git restore --source=base -- <paths>`.'
    not_text: '`{path}` isn''t text at `{ref}`: the session writes text files only.'
    option: '`git restore` doesn''t take `{option}` here: it writes the files in your branch, never the
      index. It takes `--source=<ref>` and the files.'
  origin:
  - crew#778
  owner: Developer
session.delete_file:
  description: '`delete_file` deletes one existing file, never a folder.'
  messages:
    folder: '`{path}` is a folder: delete the files in it, one call each.'
    no_file: 'There''s no file `{path}` to delete.'
  origin:
  - crew#839
  owner: Developer
session.write_file:
  description: '`write_file` rewrites an existing file only when told to overwrite it.'
  messages:
    exists: '`{path}` exists. Change it with `replace_text` or `replace_definition`, or rewrite it whole
      with `overwrite: true`.'
  origin:
  - crew#778
  owner: Developer
