edit.ast_edit.apply_edit:
  description: Refused if `target` names no definition (or, for `add`, one already there), if the file
    doesn't parse, or if a replacement is empty.
  messages:
    empty: replacing {target} with nothing — use delete if that is meant
    exists: '{target} already exists — use replace, or choose another name'
    no_class: no class named {name} to add a method to
    no_definition: 'no definition named {target}. This file defines: {known}. A file''s imports and its
      `if __name__` block have no name: to change those, quote the lines in `text_edits` (#204).'
    no_import: add_import needs the import statement as its source
    unparsed: 'the file does not parse: {error}'
  owner: Developer
  told_in: FileEdit
edit.delivery.these_tests_arent_in_their:
  description: Outside Python, refused unless written under this name in new_files or text_edits.
  messages:
    default: 'these tests aren''t in their files: {tests}. Write each one in new_files or text_edits,
      titled as named here.'
  owner: Developer
  told_in: CriterionTest.test
edit.move_code.move_one:
  description: Refused if the file or the definition isn't there, the destination already defines it,
    or it uses definitions left behind.
  messages:
    defined: 'can''t move `{name}`: {path} already defines it'
    left_behind: 'can''t move `{name}` alone: it uses {uses} from {source}. Move those to {target} in
      the same change.'
    no_definition: 'can''t move `{name}`: {path} has no top-level definition by that name'
    no_file: 'can''t move `{name}`: {path} doesn''t exist'
  owner: Developer
  told_in: Move
edit.workspace.apply:
  exempt: re-checks a path the form already refused; no answer reaches it
  messages:
    default: '{path} resolves outside the worktree'
  owner: Developer
edit.workspace.apply_implementation:
  description: 'Refused if the file doesn''t exist: a new one goes in `new_files`.'
  messages:
    missing: '{path} does not exist. A file that does not exist yet belongs in new_files, written in full.'
    not_a_file: '{path} can''t be deleted: it isn''t a file in the repository'
    outside: '{path} resolves outside the worktree'
  owner: Developer
  told_in: FileEdit.path
edit.workspace.outside_definitions:
  description: In a Python file, refused if it reaches into or brings in a function or class, or appends
    imports at the end.
  messages:
    appends_imports: this text edit appends imports to the end of {path}, after the code that uses them.
      Add each import with `edits`, operation `add_import`, which puts it with the file's imports, or
      replace the file's import lines with a text edit whose `find` is those lines.
    brings_in: this text edit brings in a definition. {how}
    reaches_into: this text edit reaches into `{name}`. {how}{replace}
  origin:
  - crew#204
  - sprint-metrics#133
  owner: Developer
  told_in: TextEdit
edit.workspace.plan_text_edits:
  description: Refused unless it's in the file exactly once, as the file has it; the file must exist,
    not be a placeholder, and stay valid Python.
  messages:
    ambiguous: 'the text to replace occurs {count} times in {path}. Quote more of the surrounding text
      so it names one place:

      {quote}'
    invalid: 'after the text edits, {path} is no longer valid Python: {error} on line {line}'
    missing: '{path} does not exist. A file that does not exist yet belongs in new_files, written in full.'
    not_found: 'the text to replace in {path} is not in the file. Quote it exactly as the file has it,
      including indentation:

      {quote}'
    outside: '{path} resolves outside the worktree'
    placeholder: '{path} is a walking skeleton''s placeholder. Replace it whole in `new_files`, without
      the `crew:placeholder` marker.'
  owner: Developer
  told_in: TextEdit.find
form.FileEdit.source_matches_the_operation:
  description: Refused if empty, except for `delete`.
  messages:
    default: '{operation} needs source. Only delete may omit it.'
  origin:
  - crew#196
  owner: Developer
  told_in: FileEdit.source
form.FileWrite.is_plausible:
  description: Refused if empty or over its size limit.
  messages:
    empty: file content is empty
    too_large: file exceeds {limit} bytes. Split the work into smaller changes rather than generating
      one very large file.
  owner: Developer
  told_in: FileWrite.content
form.Implementation.does_something:
  description: Refused if it changes no file, unless it only asks for files.
  messages:
    default: an implementation must create a file or edit one
  owner: Developer
  told_in: Implementation, FirstAttempt
form.Move.somewhere_else:
  description: Refused if `to_path` is `from_path`.
  messages:
    default: '`{name}` would move to the file it''s already in'
  owner: Developer
  told_in: Move
form.TextEdit.changes_something:
  description: Refused if `replace` is the same as `find`.
  messages:
    default: the edit to {path} changes nothing
  owner: Developer
  told_in: TextEdit
guard.overwrite.overwrites_existing:
  messages:
    default: 'These already exist: {files}. Change them with `edits`, addressed by name, rather than rewriting
      them as new files. Only a file that does not exist yet belongs in new_files, or a placeholder marked
      `crew:placeholder` replaced whole, without the marker.{not_applied}'
  owner: Developer
