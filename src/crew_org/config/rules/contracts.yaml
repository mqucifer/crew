# What other work relies on, and declared changes to it. Declared once each (crew#756, ADR 0031): change a rule here.
check.gates.a_release_clears_the_declared_changes:
  description: At `done`, a release Task in a project that keeps `declared-changes.json` empties its
    `changes`, and moves its `api_version` once, by one, when anything was declared; with nothing
    declared, the version stays (crew#1019).
  messages:
    default: '`declared-changes.json` declares changes to the answers ({changes}), so this release moves
      `api_version` from "{before}" to "{after}", and the code''s with it, and empties `changes`. The
      branch has `api_version` "{version}" and {left} changes left.'
    nothing: '`declared-changes.json` declares nothing, so the responses offer what they did and
      `api_version` stays "{before}". The branch moves it to "{version}": put it back.'
    unreadable: '`declared-changes.json` can''t be read on this branch: {why}. Keep it a JSON object with
      `api_version` and an empty `changes` list.'
  origin:
  - crew#1019
  - mqucifer/sprint-metrics#953
  - mqucifer/sprint-metrics#959
  owner: DevOps Engineer
check.gates.a_story_sets_the_api_version:
  cases:
  - told.business_analyst.a_criterion_never_names_a_version
  description: At `done`, a story, a bug or a Task that isn't the release leaves `api_version` in
    `declared-changes.json` as merged, and the file readable, since the release moves the version
    once (crew#1019).
  messages:
    default: 'This branch moves `api_version` in `declared-changes.json` from "{before}" to "{after}".
      The release moves it, once, for everything declared, so put it back. Declare what this changes
      in the responses under `changes` instead.'
    unreadable: '`declared-changes.json` can''t be read on this branch: {why}. Keep it a JSON object
      with `api_version` as merged and `changes`, each an object with `response`, `path` (the answer''s
      JSONPath) and `why`.'
  origin:
  - crew#1019
  - mqucifer/sprint-metrics#953
  - mqucifer/sprint-metrics#959
  owner: Developer
check.gates.a_release_collects_the_changelog:
  description: At `done`, DevOps's release leaves no changelog fragment and no entry under `[Unreleased]`,
    since its section holds them all and one left would ship again in the next release's notes (towncrier,
    Keep a Changelog).
  messages:
    default: 'The release leaves {left}. Build its section with `towncrier build --version <X.Y.Z> --date
      <YYYY-MM-DD>`: it collects every fragment and `[Unreleased]` entry into `{path}` and deletes the
      fragments.'
  origin:
  - crew#1010
  owner: DevOps Engineer
check.gates.no_changelog_entry:
  description: At `done`, a story or a bug whose branch changes what the project ships adds its towncrier
    fragment, `changes/<n>.<kind>.md`, since a release builds its section from the fragments; and no story
    writes under `[Unreleased]`, which conflicted with every release cut while it was in flight. Tests,
    docs, the repository's settings and a project with no changelog are left out.
  messages:
    default: 'This branch changes what the project ships ({paths}), and adds no changelog fragment. Add
      one file, `{directory}/<n>.<kind>.md`, `<n>` this issue''s number and `<kind>` the Keep a Changelog
      section it fits (added, changed, deprecated, removed, fixed or security), holding one line on what
      changed for someone using the project. A release builds its section from the fragments.'
    done: 'Your branch changes what the project ships ({paths}), and adds no changelog fragment. Add one
      file, `{directory}/<n>.<kind>.md`, `<n>` this issue''s number and `<kind>` the Keep a Changelog
      section it fits (added, changed, deprecated, removed, fixed or security), holding one line on what
      changed for someone using the project: a release builds its section from the fragments.'
    unreleased: 'Your branch writes under `[Unreleased]` in `{path}`. Only a release writes `{path}`: put
      the line in a fragment, `{directory}/<n>.<kind>.md`, and take it out of `{path}`.'
  origin:
  - crew#816
  - crew#1010
  - ADR 0019
  owner: Developer
check.gates.the_business_analyst_ruled_that:
  description: At `done`, merged tests changed where the story says they stay unchanged go back when the
    Business Analyst rules the story doesn't change them.
  messages:
    default: 'The Business Analyst ruled that this story doesn''t change {tests}: {why} Put them back
      as they were, and make your change pass with them as they are.'
  origin:
  - crew#584
  - crew#778
  owner: Developer
check.gates.these_merged_tests_changed:
  description: At `done`, a merged test the branch changes or removes is declared in `done`'s changed
    tests, with why.
  messages:
    default: 'These merged tests changed, and `done` doesn''t declare them: {tests}. Declare each in `done`''s
      changed tests with why, or put it back as it was.'
    done: 'Your branch changed these merged tests, and `done` doesn''t declare them: {tests}. Add each
      to `done` as `changed_tests: [{{test, why}}]`, with why, or put it back as it was.'
  origin:
  - crew#778
  - crew#839
  owner: Developer
check.record.check_change:
  description: 'Refused if it changes or deletes a row in place, or settles a question it may not: a later
    row replaces a row, and only its author or the Sponsor may.'
  messages:
    bad_settler: '{question} names {settler} to settle it, not the Architect or the implementer'
    default: '{problems}'
    deleted: '{row} was deleted; a row is only ever replaced'
    in_place: '{row} was changed in place; a later row replaces it instead'
    no_author: '{row} is set by {by}, who sets no rows'
    no_question: '{row} replaces {replaces}, which is no open question'
    not_an_id: '{row} is not a decision''s ID'
    not_author: '{row}, set by the {by}, replaces {target}, set by the {target_by}: only its author or
      the Sponsor may'
    not_binding: '{row} is new and so binding, not {status}'
    not_binding_row: '{row} replaces {replaces}, which is no binding row'
    not_marked: '{target} isn''t marked as replaced by {row}'
    not_settler: '{row}, set by the {by}, settles {question}, which is the {settler}''s to settle'
    question_removed: '{question} was removed; a question is settled by a row that replaces it'
    shared_id: two rows share an ID
    still_open: '{question} is still open after {row} settled it'
    test_deleted: '{row} was deleted; a test row is only ever dropped, with why'
    test_renamed: '{row} names another test now; add a row instead'
    unidentified: '{row} has no {missing}'
  owner: Product Owner
  told_in: Row, AnswerRow, SponsorRow, DesignAnswer
form.ContractRuling.an_amendment_says_what:
  description: Refused if an amendment doesn't name the tests and what they must assert.
  messages:
    default: an amendment names the tests and what they must assert after
  owner: Business Analyst
  told_in: ContractRuling
form.ContractRuling.test_ids:
  description: Refused unless each is `path::test`.
  messages:
    default: name each test as `path::test`, not {tests}
  owner: Business Analyst
  told_in: ContractRuling.tests
form.story.opt_in_or_contract:
  cases:
  - form.Story.opt_in_or_contract
  - form.RepairedStory.opt_in_or_contract
  description: Refused unless it starts 'opt-in' or 'contract change'.
  messages:
    default: 'say ''opt-in'' or ''contract change: <the tests it updates>'' (#189)'
  owner: Business Analyst
  told_in: Story.pinned_behaviour, RepairedStory.pinned_behaviour
