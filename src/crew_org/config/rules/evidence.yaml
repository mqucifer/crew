# Tests prove the criteria. Declared once each (crew#756, ADR 0031): change a rule here.
check.acceptance.proven_by_a_check_that_runs_it:
  description: A criterion proven by a CI check names one on this commit that passed, and quotes the step
    of its workflow that runs it.
  messages:
    no_check: 'criterion {n}: `{check}` isn''t a check on this commit. Its checks are {checks}.'
    no_step: 'criterion {n}: quote the step of `{check}`''s workflow, under `.github/workflows/`, that
      runs it. A check proves only what its steps execute.'
    outcome: 'criterion {n}: `{check}` is {outcome} on this commit, which proves nothing yet.'
  origin:
  - crew#325
  - crew#814
  - crew#895
  owner: QA Engineer
  told_in: CriterionVerdict.check
check.acceptance.quoted_as_it_reads:
  description: Each quote is in its file at the branch's commit, or in a line `git diff base` removed.
  messages:
    no_file: 'criterion {n}: there''s no file `{path}` on the branch, and the quote isn''t in what
      `git diff base` removed.'
    not_found: 'criterion {n}: the quote isn''t in `{path}` at the branch''s commit, nor in what `git
      diff base` removed. Copy the words from `view`.'
  origin:
  - crew#895
  owner: QA Engineer
  told_in: Quote.text
check.acceptance.ran_as_cited:
  description: Each cited run is one this session ran, with its exit code; a criterion proven by a run
    rests on runs that exited 0 and passed a test.
  messages:
    code: 'criterion {n}: `{command}` exited {code}, not {said}.'
    failed: 'criterion {n}: `{command}` exited {code}. A run that failed proves nothing.'
    none_passed: 'criterion {n}: `{command}` passed no test: its tests were skipped or not collected, and
      prove nothing.'
    not_run: 'criterion {n}: `{command}` isn''t a command this session ran. Run it with `run`, then cite
      it as its reply showed it after `$`.'
  origin:
  - crew#817
  - crew#895
  owner: QA Engineer
  told_in: CriterionVerdict.ran
check.acceptance.read_proves_the_artifact:
  description: A criterion proven by reading quotes the file it's about (a doc, the changelog, the version,
    a schema, or a path it names), never source or tests in place of running them.
  messages:
    default: 'criterion {n}: `{path}` is code or a test. A criterion about what the code does is proven
      by `run` or `check`, not by quoting it.'
  origin:
  - crew#895
  owner: QA Engineer
  told_in: CriterionVerdict.by
check.qa_crew.check_cited:
  exempt: says the findings of check.acceptance.ran_as_cited, quoted_as_it_reads, read_proves_the_artifact
    and proven_by_a_check_that_runs_it, which are told in CriterionVerdict and Quote; refuses nothing of
    its own
  origin:
  - crew#895
  owner: QA Engineer
check.criteria_check.check_each:
  exempt: runs QA's criteria check one story per session and returns its conflicts; refuses nothing.
    Its text is a re-check's start, told to QA, and the conflicts reach the Business Analyst by check.criteria_check.feedback
  origin:
  - crew#583
  - crew#612
  - crew#807
  - crew#839
  - sprint-metrics#551
  - sprint-metrics#752
  owner: Business Analyst
check.criteria_check.feedback:
  description: Sent back once if its criteria can't all pass, together and with the project's code.
  messages:
    default: 'Your last split had criteria that can''t all pass:


      {conflicts}


      Split it again so every criterion can pass alongside the others and the project''s code. Where the
      epic doesn''t say which outcome it wants, choose none: leave the case out of the criteria rather
      than guessing.'
  owner: Business Analyst
  told_in: StoryProposal
check.criteria_check.with_repairs:
  exempt: applies the Business Analyst's criteria repair to its split; refuses nothing
  origin:
  - crew#612
  owner: Business Analyst
check.delivery.lint_or_tests_failed:
  description: Sent back with the report if lint or the tests fail once it's applied.
  messages:
    default: '{amended}{repair}Lint or tests failed:


      {report}'
  owner: Developer
  told_in: FirstAttempt, FirstOrDone, Implementation, Rework
check.delivery.these_named_tests_dont_exist:
  description: Refused if a test it names doesn't exist in the repository.
  messages:
    default: 'these named tests don''t exist in the repository: {tests}. Name existing tests, or write
      the test in `criteria_tests`.'
    done: 'No test by these names exists: {tests}. If no test proves the criterion yet, write one and
      run it. If one exists under another name, name that. To look, `search` for `def test_` in its file,
      or ask `tests_for` the definition.'
  origin:
  - crew#217
  - crew#221
  owner: Developer
  told_in: ExistingProof, CriterionMet.test
check.gates.a_service_wont_start:
  description: At `done`, a service the project declares for its tests that isn't running is a finding
    naming it, never a silent skip (crew#860). The declaration is DevOps's to keep true.
  messages:
    default: 'A service the project declares for its tests isn''t running in your workspace, so the tests
      that need it skip or fail there for the workspace''s reason, not your work''s:

      {services}


      The project''s `devcontainer.json` and its compose file declare these, and they''re DevOps''s to
      fix. Don''t work around it in the code or the tests: finish the rest, and call `done` again.'
  origin:
  - crew#814
  - crew#860
  owner: DevOps Engineer
check.gates.conflicts_left:
  description: At `done`, a session resolving a merge's conflicts leaves no conflict's markers in the
    files it resolves (crew#933).
  messages:
    default: 'A conflict''s markers are still in {paths}. Resolve each conflict so both sides'' changes
      hold, take out its `<<<<<<<`, `|||||||`, `=======` and `>>>>>>>` lines, then call `done` again.'
  origin:
  - crew#933
  owner: Developer
check.gates.the_branch_changes_nothing:
  description: At `done`, a branch that changes nothing goes on only if an existing test proves each criterion
    and the checks pass, as an already-done story does (crew#221).
  messages:
    default: Your branch changes nothing. A story that's already done names, in `done`, an existing test
      that proves each criterion, and the checks pass. Do the work, or name those tests.
  origin:
  - crew#221
  - crew#778
  owner: Developer
check.gates.the_checks_timed_out:
  description: At `done`, checks that hung or ran past their bound are a finding naming the hung test
    and where it waits, never counted as a test that failed (crew#839).
  messages:
    default: 'The checks didn''t finish, so nothing says how the tests after this one do:

      {tests}

      A test that hangs is waiting on something: a lock, a connection, a process. Find what it waits for
      from the frame named.'
  origin:
  - crew#839
check.gates.these_tests_skipped:
  description: At `done`, a test the branch adds or changes that skipped and that the project doesn't
    declare CI-only, by its id or its reason, goes back, so a missing service shows at `done`, not rounds
    later in CI (the Sponsor, 2026-10-21; crew#860).
  messages:
    default: 'These tests you added or changed skipped here, and CI runs them, so they prove nothing at
      `done`:

      {tests}


      Make them run here. If one needs a service the workspace doesn''t have (a database, say), don''t
      skip or fake it: the project''s `devcontainer.json` declares its services, and that''s DevOps''s.
      Say so in `done`''s summary.'
  origin:
  - mqucifer/sprint-metrics#717
  - crew#860
  - crew#917
  owner: Developer
check.review.with_docs_finding:
  description: An option the change adds that no user doc mentions is added as a blocking finding.
  messages:
    action: 'Document `{option}` in {docs} in this pull request: what it does, and an example of using
      it'
    concern: '`{option}` is added by this change, and no user doc ({docs}) mentions it'
  origin:
  - crew#191
  told_in: ReviewVerdict
check.ux_review.seen_on_the_published_site:
  description: The UX Designer's review files a correction only on a page and width it looked at on the
    published site, so each is filed with its screenshot.
  messages:
    default: You didn't look at {unseen} on the published site. `look` at it first, so the correction
      has its screenshot, or correct it where you saw it.
  origin:
  - crew#830
  owner: UX Designer
  told_in: Correction.page
