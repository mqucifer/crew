config.const.ci.MAX_JOBS:
config.const.ci.SERVICE_LOG_LINES:
config.const.criteria_check.PLANNED_LIMIT:
config.const.deploy_evidence.MAX_DEPLOY_EVIDENCE_CHARS:
config.const.qa_crew.MIN_EVIDENCE_CHARS:
config.const.review_crew.MAX_DIFF_CHARS:
config.const.review_crew.MIN_ACTION_CHARS:
config.const.review_evidence.MAX_IMPORTED_CHARS:
form.AcceptanceCriterion.names_what_to_check:
  description: Refused if it names a quality a test can't check, with nothing observable.
  messages:
    default: '''{word}'' names a quality, not something a test can check. Say what a reader would see
      instead: the exact text, the line or position it appears in, the order of sections, or a value.'
  origin:
  - crew#281
  owner: Business Analyst
  told_in: AcceptanceCriterion.then
form.CriterionVerdict.cites_what_it_rests_on:
  description: A proven criterion cites what it rests on, by its kind.
  messages:
    check: a criterion proven by a check names the check and quotes the step of its workflow that runs
      it
    read: a criterion proven by reading quotes the file it's about
    run: a criterion proven by a run cites the run, as `run`'s reply showed it
  origin:
  - crew#895
  owner: QA Engineer
  told_in: CriterionVerdict.by
form.CriterionVerdict.is_specific:
  description: Refused if too short to name a test or say what is missing.
  messages:
    default: name the test that proves this criterion, or say specifically what is missing. 'Tested' is
      not evidence.
  owner: QA Engineer
  told_in: CriterionVerdict.evidence
form.QAVerdict.a_verdict:
  description: Refused if empty.
  messages:
    default: a story is accepted against its criteria; list them
  owner: QA Engineer
  told_in: QAVerdict.criteria
form.QAVerdict.acceptance_requires_every_criterion:
  description: Refused if true while any criterion is unproven.
  messages:
    default: 'cannot accept with {count} unproven criteria. Definition of Done requires every criterion
      proven: by a test, or a doc criterion by the doc.'
  owner: QA Engineer
  told_in: QAVerdict.accepted
form.TaskTriage.fits_its_outcome:
  description: 'Refused unless it fits its outcome: an accepted Task says what done means and has a size
    from the scale, and only it does; a duplicate names its issue.'
  messages:
    done_when: only an accepted Task says what done means, not one {outcome}
    duplicate: a duplicate names the issue it duplicates in duplicate_of
    no_done_when: an accepted Task needs at least one check of what done means
    size: an accepted Task's points are one of {sizes}
  owner: Business Analyst
  told_in: TaskTriage
form.Triage.fits_its_outcome:
  description: 'Refused unless it fits its outcome: an accepted bug has criteria and a size from the scale,
    and only it has criteria; a duplicate names its issue; more_information asks its question.'
  messages:
    criteria: only an accepted bug has criteria, not one {outcome}
    duplicate: a duplicate names the issue it duplicates in duplicate_of
    no_criteria: an accepted bug needs at least one criterion reproducing it
    question: more_information asks its question in question
    size: an accepted bug is sized one of {sizes}
  owner: Business Analyst
  told_in: Triage
form.story.enough_criteria:
  cases:
  - form.RepairedStory.enough_criteria
  - form.Story.enough_criteria
  - §5.3
  description: Refused if there are fewer.
  messages:
    default: a story needs at least {count} acceptance criteria, at least one of them a failure or edge
      case
  owner: Business Analyst
  told_in: Story.acceptance_criteria, RepairedStory.acceptance_criteria
guard.reproduce.check:
  messages:
    default: The fix passes the checks, but {why}. Change them so at least one fails against the code
      as merged, for the reason the bug describes.
    recorded: "The crew filed this bug from the merged tests a workspace turned on, which fail\
      \ on the code as merged: its record on pull request {pull} names them, and reproduces\
      \ the bug. On this branch they don't all pass in the workspace yet:\n\n{tests}\n\nEach\
      \ has to run and pass there, and a file that hung has to run to its end, every test\
      \ in it passing."
    test_only: 'The defect looks like the test itself: this branch changes only tests, the
      named ones'' files among them ({files}), and none of them fails against the code as merged:
      {passed} pass there. A bug''s test has to fail on main, and a fix to the test itself
      can''t make one, so no change to this branch can meet this check. The way out is back to
      refinement, as a story: its criteria hold as they are.'
  origin:
  - crew#407
  - crew#839
  - crew#949
  owner: Developer
session.run:
  description: '`run` of tests names them, and needs the project''s checks to run pytest; `run` of lint
    needs a lint among them.'
  messages:
    no_lint: 'This project''s checks have no lint: the `suite` is what the crew runs.'
    no_pytest: 'This project''s checks name no pytest command: run the `suite`.'
    no_tests: Name the tests (ids or files), or run the `suite`.
  origin:
  - crew#778
  owner: Developer
session.tests_for:
  description: '`tests_for` needs the project''s coverage map, which is Python only.'
  messages:
    no_map: There's no coverage map for this project (it's Python only).
  origin:
  - crew#404
  - crew#778
  owner: Developer
