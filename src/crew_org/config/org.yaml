# Organization policy. The Scrum Master and the board Flow read this file;
# it is the single place process constants are defined.

board:
  # Status column order is authoritative — the Flow derives legal transitions
  # from this sequence. `Blocked` is off-flow and reachable from anywhere.
  columns:
    - Inbox (Goals)
    - Needs Refinement
    - Ready
    - Sprint Backlog
    - In Progress
    - Reviewing
    - QAing
    - Merging
    - Done
  blocked_column: Blocked

  # Columns a human owns. No agent may move a card OUT of these.
  human_gates:
    - Inbox (Goals)

wip_limits:
  Needs Refinement: 8
  # A sprint's worth each, at about 2.5 points a story: 40 points is ~16
  # stories, and a limit of 10 would stop admission ~30 points in (2026-09-26).
  Ready: 16
  Sprint Backlog: 16
  In Progress: 3
  Reviewing: 3
  QAing: 3
  Merging: 3

sprint:
  # The clock that decides which sprint it is (#193). GitHub's iterations are
  # bare dates; this says whose dates. One clock for every sprint decision:
  # the current sprint, admission, and whether a sprint's dates are over.
  timezone: America/Chicago
  # Starting capacity in points. The Sponsor approves epics, not sprint
  # contents: scope is filled mechanically from approved epics in priority
  # order until this is reached. Replaced by measured velocity once there is
  # history to measure. Doubled from 20 by the Sponsor on 2026-09-26: Sprint 7
  # delivered all 20 in an afternoon of ticks, loop-breaking included (#88
  # is still where it becomes learned rather than typed).
  capacity_points: 40
  blocked_aging_days: 3         # raise to Sponsor at sprint review beyond this

telemetry:
  # Where the crew sends its traces (#283): the OpenTelemetry Collector in
  # deploy/telemetry, on this Mac, which forwards to Grafana. Passed to the
  # exporter directly, never through OTEL_EXPORTER_OTLP_*, so no SDK can pick
  # up a Grafana address and go around the collector. Remove to send nothing.
  otlp_endpoint: http://localhost:4318

sprint_metrics:
  # The sprint-metrics service in deploy/sprint-metrics (crew#280). After each pass,
  # the tick pushes the sprint under way to it, and any sprint not yet sent
  # cleanly. A push that fails is sent again by the next pass and never stops a
  # tick. Remove to push nothing.
  url: http://127.0.0.1:8080

design:
  # The Architect is the role a 27B model is weakest at. Small epics skip
  # design entirely: a design note on a two-story epic costs more than it saves.
  #
  # An epic requires design if it exceeds ANY threshold below. Raise these to
  # design less; lower them if developers start inventing conflicting
  # approaches.
  min_points: 13          # total story points in the epic
  min_stories: 4          # number of stories
  min_modules: 3          # distinct modules or packages the epic touches
  force_label: needs:design   # Sponsor or Scrum Master can demand design
  skip_label: no:design       # ...or waive it
  # Stories of one sprint rebuilt over the same file before the Architect
  # revisits the project's design (#192). It starts a look, not a refactor: the
  # Architect may change nothing, and a look costs one proposal and one review.
  revisit_conflicts: 3

estimation:
  scale: [1, 2, 3, 5, 8]
  max_story_points: 8           # larger must be split, never admitted

refinement:
  # Once a Goal's epics are approved, the Architect and the UX Designer look
  # across them and the Product Owner settles that into the Goal's record,
  # before any is split (crew#858, which replaced the per-epic panel of
  # crew#440). Off, epics are split with no record.
  look: true

delivery:
  # Repositories the crew may WORK IN. Every phase is bounded by this list —
  # refinement, admission, QA and closing parents as well as claiming — so a
  # card from any other repository is left alone, however it is typed. Only
  # claiming used to check it, and refinement split the crew repository's own
  # Goal #4 into eight epics and stories on the board.
  #
  # The crew's own repository is deliberately absent. An orchestrator editing
  # itself mid-run is a sharp edge: a bad change to the delivery loop breaks the
  # thing making the change, and the failure arrives with no working process to
  # diagnose it. That work is done by hand, and tracked as issues on the crew
  # repository by their P0–P3 labels — not on the board the crew works from.
  repos:
    - sprint-metrics
    # Where the crew and its projects run, and why; private (crew#335, §20).
    - infra
    # crew-presentation, the public site that shows how the crew works (crew
    # Discussion 260; onboarded 2026-10-07). Paused from 2026-10-07 until
    # delivery-history's first release (crew#523), since it depends only on that
    # package (ADR 0021, crew#521). Back on 2026-10-13: the release is
    # delivery-history-2026-10-13, pinned in its delivery-history.tag; its record
    # was rewritten to the package (mqucifer/crew-presentation#24) and the
    # Architect's design proposed again against it (mqucifer/crew-presentation#29).
    - crew-presentation

sandbox:
  # Testing the crew's output means executing code an LLM wrote. That happens in
  # a container with no network, no capabilities, a non-root user and hard
  # resource limits.
  #
  # 'required' fails when no engine is available rather than falling back to the
  # host — a silent fallback looks protected while running arbitrary code as the
  # user. 'off' is an explicit acceptance of that risk, never a default.
  mode: required
  engine: docker
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

# Whose comments the crew reads (crew#399). Everyone else's are ignored and
# noted: the repositories are public, and a comment is read into prompts as
# direction or as a crew verdict. Adding a person is the Sponsor's decision,
# like delivery.repos.
trust:
  # Direction: rework notes, answers to the Product Owner's questions.
  sponsor: mquarters
  # The crew's own records: verdicts, notes, proposals.
  crew: ["mqucifer-crew[bot]", "mqucifer-crew-approver[bot]"]
  # Read as data only, never as direction (dependency updates, CI).
  tools: ["dependabot[bot]", "github-actions[bot]"]
