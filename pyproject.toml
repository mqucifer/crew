[project]
name = "crew-org"
version = "0.1.0"
description = "An agile engineering organization of model-backed roles, orchestrated by a GitHub Projects v2 board."
readme = "README.md"
# Pinned to 3.12, the version the crew has always run on. CrewAI set the range
# and has gone (crew#583, ADR 0025); widening it is a change of its own.
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27",          # Projects v2 GraphQL
    "pyyaml>=6.0",
    "rich>=13.7",           # live TUI
    "typer>=0.12",          # crew CLI
    "pyjwt[crypto]>=2.9",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.20",
]

[project.scripts]
crew = "crew_org.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_org"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
