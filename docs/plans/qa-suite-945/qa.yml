# QA's functional tests, run against a pull request's build (ADR 0006 in
# mqucifer/project-print).
#
# A delivery repository's pull-request workflow calls this one, passing its
# project's name (project-template's `.github/workflows/qa.yml`). It checks out
# the caller's pull request and this repository's main, starts the build with
# `<project>/start.sh` as the project's own CI would, and runs `<project>/`'s
# tests. A project with no folder here yet passes, and says so, so the calling
# workflow can reach every project before its tests exist.
#
# The pull request also runs the tests of each project that reads the caller
# (ADR 0008 in mqucifer/project-print): `readers.py` finds them from each
# project's own record, its `uses`, never from a list here. A reader's tests run
# against the reader's main, with the caller's pull request as what it reads
# (`QA_PRODUCER` and `QA_PRODUCER_CHECKOUT` for its `start.sh`). The `qa` job at
# the end is the check a delivery repository requires, `qa-suite / qa`, so its
# id never changes.
#
# A disputed pull request runs QA's changed test, not main's (mqucifer/crew#945).
# When an open pull request from one of qa-suite's own branches names the caller's
# pull request in its dispute marker (see `suite.yml`), that pull request's head is
# the qa-suite this runs. Its check already passed against the caller's head, and
# the crew lands the caller first, then it, straight after.

name: qa

on:
  workflow_call:
    inputs:
      project:
        description: The project's folder here, its repository's name.
        required: true
        type: string
      suite-ref:
        # ADR 0006 runs main. This is only for proving a change to this
        # repository before it merges: from a delivery repository's branch, or
        # from qa-suite's own pull request (`suite.yml`). The template never sets it.
        description: The ref of qa-suite to run. Leave it as main.
        required: false
        type: string
        default: main
      build-repository:
        # Only `suite.yml` sets it, to run a qa-suite pull request's tests against
        # the project's main (mqucifer/crew#896). The template never sets it.
        description: The repository to build at its default branch, instead of the caller's pull request.
        required: false
        type: string
        default: ""
      build-ref:
        # Only `suite.yml` sets it, for a dispute: the disputed pull request's head
        # (mqucifer/crew#945). The template never sets it.
        description: The commit of `build-repository` to build, instead of its default branch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.find.outputs.ref }}
    steps:
      - name: Find the qa-suite this runs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_REF: ${{ inputs.suite-ref }}
          BUILD_REPOSITORY: ${{ inputs.build-repository }}
          CALLER: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          QUEUED: ${{ github.event.merge_group.head_ref }}
        run: |
          # Set by `suite.yml` or by hand, it's used as it is.
          if [ "$SUITE_REF" != main ] || [ -n "$BUILD_REPOSITORY" ]; then
            echo "ref=$SUITE_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # In a merge queue the pull request is in the queue's branch name:
          # gh-readonly-queue/<base>/pr-<n>-<sha>.
          if [ -z "$PULL" ] && [[ "$QUEUED" =~ /pr-([0-9]+)- ]]; then
            PULL="${BASH_REMATCH[1]}"
          fi
          ref=main
          if [ -n "$PULL" ]; then
            marker="<!-- crew:qa-dispute repo=${CALLER#*/} story="
            found=$(gh api --paginate "repos/mqucifer/qa-suite/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"mqucifer/qa-suite\")
                     | select((.body // \"\") | contains(\"$marker\"))
                     | select((.body // \"\") | test(\" pull=$PULL head=\"))
                     | .head.sha" | tail -n 1)
            if [ -n "$found" ]; then
              ref="$found"
              echo "A dispute of this pull request: QA's changed tests run, at $found." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  readers:
    needs: suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    env:
      PROJECT: ${{ inputs.project }}
    steps:
      - name: Check the project's name
        run: |
          if ! [[ "$PROJECT" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::'$PROJECT' isn't a repository name, so it can't name a folder here"
            exit 1
          fi

      - name: Check out qa-suite
        uses: actions/checkout@v4
        with:
          repository: mqucifer/qa-suite
          ref: ${{ needs.suite.outputs.ref }}
          path: suite
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Find the projects that read it
        id: find
        working-directory: suite
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REPOSITORY: ${{ inputs.build-repository }}
        run: |
          # suite.yml builds a project's main to prove QA's own change: there is
          # no producer's pull request, so its readers don't run.
          if [ -n "$BUILD_REPOSITORY" ]; then
            echo "matrix=[{\"folder\": \"$PROJECT\", \"reads\": \"\"}]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --locked python .github/qa/readers.py mqucifer "$PROJECT" .

  run:
    needs: [suite, readers]
    name: ${{ matrix.reads && format('{0} reads {1}', matrix.folder, matrix.reads) || matrix.folder }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.readers.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.folder }}
      READS: ${{ matrix.reads }}
    steps:
      - name: Check out the pull request
        if: matrix.reads == '' && inputs.build-repository == ''
        uses: actions/checkout@v4
        with:
          path: build
          persist-credentials: false

      - name: Check out the project's main, or the disputed pull request's head
        if: matrix.reads == '' && inputs.build-repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.build-repository }}
          ref: ${{ inputs.build-ref }}
          path: build
          persist-credentials: false

      - name: Check out the reader's main
        if: matrix.reads != ''
        uses: actions/checkout@v4
        with:
          repository: mqucifer/${{ matrix.folder }}
          path: build
          persist-credentials: false

      - name: Check out the pull request, as what the reader reads
        if: matrix.reads != ''
        uses: actions/checkout@v4
        with:
          path: producer
          persist-credentials: false

      - name: Check out qa-suite
        uses: actions/checkout@v4
        with:
          repository: mqucifer/qa-suite
          ref: ${{ needs.suite.outputs.ref }}
          path: suite
          persist-credentials: false

      - name: Find the project's tests
        id: find
        run: |
          if [ ! -d "suite/$PROJECT" ]; then
            msg="qa-suite has no tests for $PROJECT yet, so there is nothing to run. This passes."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in start.sh stop.sh; do
            if [ ! -f "suite/$PROJECT/$f" ]; then
              echo "::error::qa-suite's $PROJECT/ has tests but no $f, so the build can't be started"
              exit 1
            fi
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.find.outputs.found == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Start the build
        if: steps.find.outputs.found == 'true'
        run: |
          if [ -n "$READS" ]; then
            export QA_PRODUCER="$READS" QA_PRODUCER_CHECKOUT="$GITHUB_WORKSPACE/producer"
          fi
          bash "suite/$PROJECT/start.sh" "$GITHUB_WORKSPACE/build"

      - name: Run QA's tests
        if: steps.find.outputs.found == 'true'
        working-directory: suite
        run: uv run --locked pytest "$PROJECT" -v --junitxml="$RUNNER_TEMP/qa.xml"

      - name: Name the tests that failed
        if: failure() && steps.find.outputs.found == 'true'
        run: |
          python3 - "$RUNNER_TEMP/qa.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          who = os.environ["PROJECT"]
          if os.environ["READS"]:
              who += f" (it reads {os.environ['READS']})"


          def prop(text):
              # A workflow command's property ends at a comma or colon unless escaped.
              for a, b in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
                  text = text.replace(a, b)
              return text


          try:
              cases = ET.parse(sys.argv[1]).iter("testcase")
          except (OSError, ET.ParseError):
              sys.exit(0)  # The build didn't start, and that step says why.
          lines = []
          for case in cases:
              bad = case.find("failure")
              if bad is None:
                  bad = case.find("error")
              if bad is None:
                  continue
              test = f"{case.get('classname')}::{case.get('name')}"
              reason = (bad.get("message") or "").splitlines()[0][:200] if bad.get("message") else ""
              print(f"::error title={prop(f'{who} failed {test}')}::{reason.replace('%', '%25')}")
              lines.append(f"- {who} failed `{test}`: {reason}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Stop the build
        if: always() && steps.find.outputs.found == 'true'
        run: bash "suite/$PROJECT/stop.sh"

  # The check a delivery repository requires (`qa-suite / qa`): keep its id.
  qa:
    needs: [suite, readers, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass only if every folder passed
        env:
          READERS: ${{ needs.readers.result }}
          RUN: ${{ needs.run.result }}
        run: |
          if [ "$READERS" != success ]; then
            echo "::error::the projects that read this one couldn't be found ($READERS)"
            exit 1
          fi
          if [ "$RUN" != success ]; then
            echo "::error::a folder's tests failed ($RUN): its job and annotation name the project and the test"
            exit 1
          fi
