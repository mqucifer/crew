# LiteLLM proxy for the crew.
#
# Rewritten from scratch for SGLang + CrewAI. The older config in
# ~/Documents/git/litellm targets a vLLM endpoint on :8000 and does not apply.
#
# There is deliberately NO Anthropic entry here. Escalation runs through
# headless Claude Code on an existing subscription, so that no configuration
# mistake can produce a metered API bill.

model_list:
  # The crew's workhorse. Every discovery and process role uses this alias, so
  # the backend can be repointed without touching agent definitions.
  - model_name: crew-local
    litellm_params:
      model: openai/qwen3.8-27b-sglang          # openai/ prefix => OpenAI-compatible server
      api_base: os.environ/SGLANG_BASE_URL
      api_key: "sk-not-used"             # SGLang ignores this; LiteLLM requires a value
      drop_params: true                  # strip params SGLang does not implement
      temperature: 0.1                   # process work wants determinism, not flair
      timeout: 1800

  # Same backend, looser sampling — for drafting prose (standups, release notes)
  # where a little variety reads better.
  - model_name: crew-draft
    litellm_params:
      model: openai/qwen3.8-27b-sglang
      api_base: os.environ/SGLANG_BASE_URL
      api_key: "sk-not-used"
      drop_params: true
      temperature: 0.6
      timeout: 1800

  # Refinement that has to hold a whole epic in its head. Same backend, same
  # thinking, with the reasoning asked to converge rather than compound.
  #
  # The Business Analyst runs here rather than on crew-local because it is the
  # refine role whose input grows without bound: epic sprint-metrics#49 hung
  # six times in one tick at reasoning_tokens 16,386 and text_tokens 0,
  # finish=length — the whole budget spent before the answer began. It is the
  # failure crew-code exists to avoid, arriving in refinement as epics get
  # bigger.
  #
  # reasoning_effort is an OpenAI-standard parameter and works well in the
  # Sponsor's other setups, so the lever itself is not in doubt. What is not
  # measured *here* is narrower: whether it survives this alias's
  # drop_params: true on the way to SGLang, and whether medium effort is
  # enough to make a large split converge.
  #
  # The check is the split that failed: run sprint-metrics#49 through and
  # watch reasoning_tokens. If the parameter is being dropped, the larger
  # max_tokens on the Business Analyst is doing the work on its own — which
  # may be enough, and is worth knowing either way.
  - model_name: crew-analysis
    litellm_params:
      model: openai/qwen3.8-27b-sglang
      api_base: os.environ/SGLANG_BASE_URL
      api_key: "sk-not-used"
      drop_params: true
      temperature: 0.1
      timeout: 1800
      reasoning_effort: medium

  # Mechanical work — routing, labelling, field-setting — where reasoning is
  # pure cost. Qwen3 honours enable_thinking=false (verified on the Spark).
  #
  # UNVERIFIED THROUGH THE PROXY: chat_template_kwargs is non-standard, and
  # drop_params may strip it. Confirm reasoning_tokens is 0 through :4000
  # before trusting this alias, or the saving is imaginary.
  - model_name: crew-mechanical
    litellm_params:
      model: openai/qwen3.8-27b-sglang
      api_base: os.environ/SGLANG_BASE_URL
      api_key: "sk-not-used"
      drop_params: true
      temperature: 0.0
      timeout: 1800
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Implementation work. Reasoning is switched OFF deliberately, and this is
  # the single largest performance decision in the system.
  #
  # Measured on the same story, same schema, same prompt:
  #   thinking ON  — 27 minutes, no valid output, circular reasoning
  #   thinking OFF — 55 seconds, 2,195 tokens, a valid implementation
  #
  # This model reasons circularly on long structured generations: the
  # reasoning compounds instead of converging, exhausts the token budget, and
  # the answer never arrives. Refinement is short enough to survive it and
  # measurably benefits, so crew-local keeps thinking on.
  - model_name: crew-code
    litellm_params:
      model: openai/qwen3.8-27b-sglang
      api_base: os.environ/SGLANG_BASE_URL
      api_key: "sk-not-used"
      drop_params: true
      temperature: 0.1
      timeout: 1800
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

litellm_settings:
  drop_params: true
  # A timeout must outlast the generation it carries, or the proxy kills work
  # the server is still doing. The arithmetic: max_tokens / tokens-per-second.
  # Measured at ~36 tok/s, a 16,384-token implementation takes ~460s, so 300
  # could never have completed one — it returned 408 mid-generation while
  # SGLang carried on, and the client retried into the same wall.
  # 1800 leaves headroom for reasoning tokens and a slower day.
  request_timeout: 1800
  # Agents retry through the escalation policy, not blindly at the transport
  # layer — a silent retry storm would hide the failure classification.
  num_retries: 0
  callbacks:
    - prometheus 
  require_auth_for_metrics_endpoint: false

general_settings:
  # Keeps a local record of every request for the audit trail.
  store_model_in_db: false
