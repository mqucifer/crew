# LiteLLM proxy for the crew.
#
# Every credential here comes from the repository-root .env, which is
# gitignored. Nothing in this file is a secret, and nothing in it may become
# one: a key committed here is a key in the history forever.
#
# Start it from this directory:
#
#   docker compose --env-file ../../.env up -d
#
# The --env-file is not optional. Compose looks for .env in the directory
# holding the compose file, which is not where the crew's .env lives, and the
# `:?` guards below turn a missing one into a refusal to start rather than a
# proxy that runs with no authentication at all.

services:
  litellm-temp-db:
    image: postgres:16-alpine
    container_name: litellm-temp-db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_admin
      # Not a secret, and deliberately not treated as one: this database is
      # ephemeral, its port is never published, and it is reachable only from
      # this compose network. It is a variable so that it is written once —
      # DATABASE_URL below must agree with it, and two literals silently
      # drifting apart is a harder failure to read than a missing password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local-only}
    # Kept across restarts since 2026-09-26: it now holds every request and
    # response, reasoning included (`store_prompts_in_spend_logs` in
    # config.yaml), so a thinking block can be read after the fact. Until then
    # it had no volume and was wiped on every restart. Models still come from
    # config.yaml only (`store_model_in_db: false`); retention is set there.
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm_admin -d litellm"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: crew-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      # The healthcheck above existed but nothing waited on it, so the proxy
      # could and did start against a database still coming up.
      litellm-temp-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://litellm_admin:${POSTGRES_PASSWORD:-litellm-local-only}@litellm-temp-db:5432/litellm
      # Point at the Spark, e.g. http://gx10-3703.local:30000/v1
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:?set SGLANG_BASE_URL to the SGLang /v1 endpoint}
      # The same variable the crew authenticates with, on purpose. The proxy's
      # master key and the client's key are one value, so they cannot drift.
      - LITELLM_MASTER_KEY=${CREW_LLM_API_KEY:?set CREW_LLM_API_KEY in the root .env}
      # Admin UI login at /ui. Separate from the master key: one credential
      # leaking should not hand over the other.
      - UI_USERNAME=${LITELLM_UI_USERNAME:?set LITELLM_UI_USERNAME in the root .env}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:?set LITELLM_UI_PASSWORD in the root .env}
      # LiteLLM cuts every string it stores at 2,048 characters by default, which
      # would keep the first paragraph of a thinking block and nothing else. A
      # full-context call is a few hundred thousand characters; this is above
      # any call the 262,144-token context allows.
      - MAX_STRING_LENGTH_PROMPT_IN_DB=4000000
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  litellm-db:
