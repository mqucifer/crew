# OpenTelemetry Collector for the crew (#283). The Sponsor owns this file.
#
# In:  the crew's attributes-only telemetry log (logs), the exporter's and
#      LiteLLM's /metrics (metrics), and OTLP from the crew (traces, once they
#      exist).
# Out: Grafana Cloud's OTLP gateway, with the endpoint and Authorization
#      header from the repository-root .env (GRAFANA_OTLP_ENDPOINT and
#      GRAFANA_OTLP_AUTH). Deliberately not the standard OTEL_EXPORTER_OTLP_*
#      names: every OTel SDK reads those, and would send straight to Grafana
#      around this collector and its content filter.
#
# Nothing with content should ever arrive here: the crew sends attributes only.
# `transform/no-content` is a second lock on that door, for anything an
# instrumentation library adds that the crew didn't write.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Where filelog remembers how far it read, so a restart doesn't re-send
  # every line. On a volume, in the compose file.
  file_storage:
    directory: /var/lib/otelcol

receivers:
  # The crew's telemetry log: one JSON object a line, attributes only.
  # New lines only. Grafana Cloud accepts back-dated entries with a 204 and
  # never shows them (tried 2026-09-27: one stamped two days back vanished,
  # one stamped now appeared), and its retention is 7 days anyway. History
  # stays local, in var/events and var/telemetry.
  file_log/crew:
    include: [/telemetry/*.jsonl]
    start_at: end
    storage: file_storage
    include_file_name: true
    operators:
      - type: json_parser
        parse_to: attributes
        timestamp:
          parse_from: attributes.at
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      # The event's kind reads as the log body; everything else stays attributes.
      - type: copy
        from: attributes.kind
        to: body
      - type: remove
        field: attributes.at

  # The exporter's counts and totals.
  prometheus/crew:
    config:
      scrape_configs:
        - job_name: crew
          scrape_interval: 30s
          static_configs:
            - targets: ["crew-telemetry:9464"]
        # LiteLLM's own metrics: requests, latency, tokens and failures by
        # model alias. No content is ever in them; what's dropped is identity
        # and internal detail. It runs in its own compose stack, so it's reached
        # through the host. /metrics redirects to /metrics/.
        - job_name: litellm
          scrape_interval: 30s
          metrics_path: /metrics/
          static_configs:
            - targets: ["host.docker.internal:4000"]
          metric_relabel_configs:
            # Who called (empty today, identifying the day keys or users
            # exist), from where, with what, and the Spark's internal address.
            - action: labeldrop
              regex: "user_email|user|end_user|team|team_alias|org_id|org_alias|api_key_alias|hashed_api_key|client_ip|user_agent|api_base"

  # Spans from the crew, and LiteLLM's if it's pointed here too.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Grafana Cloud's Loki refuses an entry older than 7 days, and one refused
  # entry fails the whole batch it's in: the first backfill lost 3,755 logs
  # that way, recent ones included. Older records are dropped here, a day
  # inside the limit. var/telemetry keeps them, and the exporter's counters
  # still count them.
  filter/loki-window:
    error_mode: ignore
    logs:
      log_record:
        - 'log.time_unix_nano < UnixNano(Now()) - 518400000000000'  # 6 days, in ns
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  batch: {}
  resource/crew:
    attributes:
      - key: service.namespace
        value: crew
        action: upsert
      - key: deployment.environment
        value: local
        action: upsert
  resource/logs:
    attributes:
      - key: service.name
        value: crew
        action: upsert
  # The second lock: drop any attribute that could carry prompt or response
  # content. The OpenInference and OpenLLMetry instrumentors, and the GenAI
  # conventions' opt-in content capture, use these names.
  transform/no-content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(span.attributes, "^(gen_ai\\.(prompt|completion|input|output|system_instructions).*|gen_ai\\.content.*|llm\\.(input|output)_messages.*|llm\\.prompts?.*|input\\.value|output\\.value|.*\\.messages.*)$")
      - context: spanevent
        statements:
          - delete_matching_keys(spanevent.attributes, "^(gen_ai\\..*content.*|gen_ai\\.(prompt|completion).*|.*\\.messages.*)$")
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(log.attributes, "^(summary|error|output|first_error|unproven|answer|question|reason_text)$")

exporters:
  debug:
    verbosity: basic
  # Grafana Cloud's OTLP gateway. The endpoint ends in /otlp; the exporter adds
  # /v1/traces, /v1/metrics and /v1/logs. The header is "Basic <base64 of
  # instance ID:token>", as the stack's OpenTelemetry page gives it.
  otlp_http/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_OTLP_AUTH}

service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [file_log/crew]
      processors: [memory_limiter, filter/loki-window, transform/no-content, resource/logs, resource/crew, batch]
      exporters: [otlp_http/grafana]  # add debug to see it locally
    metrics:
      receivers: [prometheus/crew]
      processors: [memory_limiter, resource/crew, batch]
      exporters: [otlp_http/grafana]  # add debug to see it locally
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/no-content, resource/crew, batch]
      exporters: [otlp_http/grafana]  # add debug to see it locally
