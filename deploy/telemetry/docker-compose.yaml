# The crew's metrics exporter (#283): Prometheus text at :9464/metrics, for the
# Sponsor's Alloy to scrape. The crew itself ships nothing anywhere.
#
# It sees only `var/telemetry` (attributes, never content), read-only, and
# runs a single standard-library script. Start it from this directory:
#
#   docker compose up -d
#
# Collected by an OpenTelemetry Collector on this Mac (crew-otelcol, below),
# which the Sponsor owns: otelcol.yaml says where everything goes. It reads the
# telemetry log, scrapes this exporter over the compose network, and receives
# the crew's OTLP. The crew itself ships nothing anywhere.

services:
  crew-telemetry:
    image: python:3.12-alpine
    container_name: crew-telemetry
    command: ["python", "/app/exporter.py"]
    environment:
      TELEMETRY_DIR: /telemetry
      PORT: "9464"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ../../var/telemetry:/telemetry:ro
    # The collector scrapes it over the compose network. Published on loopback
    # too, for a look by hand; TELEMETRY_BIND=0.0.0.0 would open it to the LAN.
    ports:
      - "${TELEMETRY_BIND:-127.0.0.1}:9464:9464"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  crew-otelcol:
    # Pinned: a collector upgrade is a deliberate change, like LiteLLM's.
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: crew-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    # Credentials for whichever exporter otelcol.yaml enables, from the
    # repository-root .env (gitignored): docker compose --env-file ../../.env up -d
    environment:
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_INSTANCE_ID: ${GRAFANA_INSTANCE_ID:-}
      GRAFANA_API_TOKEN: ${GRAFANA_API_TOKEN:-}
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
      - ../../var/telemetry:/telemetry:ro
      - otelcol-storage:/var/lib/otelcol
    # OTLP for the crew and LiteLLM on this Mac; health on 13133.
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on: [crew-telemetry]
    # Root in the container, with every capability dropped: a fresh named volume
    # is root-owned, and the image's own user (10001) couldn't keep its read
    # offsets there. Read-only everywhere but that volume.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

volumes:
  otelcol-storage:
