# The crew's metrics exporter (#283): Prometheus text at :9464/metrics, for the
# Sponsor's Alloy to scrape. The crew itself ships nothing anywhere.
#
# It sees only `var/telemetry` (attributes, never content), read-only, and
# runs a single standard-library script. Start it from this directory:
#
#   docker compose up -d
#
# The Sponsor's Alloy runs as a Home Assistant add-on, on another machine, so it
# scrapes this over the LAN: http://<this Mac's address>:9464/metrics.
#
# Logs: that Alloy can't tail files on this Mac. How var/telemetry reaches Loki
# is still to decide (#283). The log itself is one JSON object a line; `kind`,
# `role` and `repo` make sensible labels, and `card` belongs in structured
# metadata, not a label.

services:
  crew-telemetry:
    image: python:3.12-alpine
    container_name: crew-telemetry
    command: ["python", "/app/exporter.py"]
    environment:
      TELEMETRY_DIR: /telemetry
      PORT: "9464"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ../../var/telemetry:/telemetry:ro
    # On the LAN, for the Home Assistant Alloy. It serves counts and totals only,
    # never content. TELEMETRY_BIND=127.0.0.1 keeps it on this Mac alone.
    ports:
      - "${TELEMETRY_BIND:-0.0.0.0}:9464:9464"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
